         <button class="yoq" id="yoq">Yoq</button>

    </div>

  
<script>
    const yoq = document.getElementById("yoq");

    function qoch() {
    const maxX = Math.max(0, window.innerWidth - yoq.offsetWidth);
    const maxY = Math.max(0, window.innerHeight - yoq.offsetHeight);

        const x = Math.random() * maxX;
        const y = Math.random() * maxY;

        yoq.style.position = "fixed";
        yoq.style.left = x + "px";
        yoq.style.top = y + "px";
    }

    yoq.addEventListener("pointerenter", qoch);
    yoq.addEventListener("touchstart", function(event) {
        event.preventDefault();
        qoch();
    });
</script>
